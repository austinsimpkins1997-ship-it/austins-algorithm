name: Workbench release

on:
  push:
    tags:
      - 'workbench-v*'

permissions:
  contents: read

concurrency:
  group: workbench-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'austinsimpkins1997-ship-it/austins-algorithm'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}\.build\pip-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify source, browser parity, and live local recovery
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path src).Path
          python -B -m unittest discover -s tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location future-reader
          try {
            python -B -m unittest discover -s tests
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python -B tools/build_companion.py --check
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            node --test tests/offline.test.cjs
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Build and verify the Windows executable and portable handoff
        shell: pwsh
        run: |
          python -m pip install --requirement tools/workbench-build-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tools/build_workbench.py --directory .build/hosted-workbench --future-reader future-reader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tools/stage_workbench_release.py --tag "$env:GITHUB_REF_NAME" --commit "$env:GITHUB_SHA" --build .build/hosted-workbench
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish the verified prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = '.build/hosted-release'
          $files = Get-ChildItem -LiteralPath "$dir/assets" -File | ForEach-Object FullName
          gh release create "$env:GITHUB_REF_NAME" @files --repo "$env:GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title "Austin's Algorithm Workbench $($env:GITHUB_REF_NAME.Substring(11))" --notes-file "$dir/notes.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false --prerelease
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
