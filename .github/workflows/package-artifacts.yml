name: verified-package-artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-replay:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - name: Build isolated Python distributions
        shell: pwsh
        run: |
          uv venv --python 3.12 .build/package-environment
          uv build --python .build/package-environment/Scripts/python.exe --out-dir dist
          uv pip install --python .build/package-environment/Scripts/python.exe (Get-ChildItem dist/*.whl).FullName
      - name: Exercise planning contracts and full package tests
        shell: pwsh
        run: |
          .build/package-environment/Scripts/python.exe -I -B -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .build/package-environment/Scripts/python.exe -I -B -m austins_algorithm plan solve examples/planning_equipment.json --nodes 10000 --seconds 5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: verified-python-distributions
          path: dist/*
          if-no-files-found: error
