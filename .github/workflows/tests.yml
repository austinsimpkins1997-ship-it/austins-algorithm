name: tests

on:
  push:
  pull_request:

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run test suite
        run: python -B -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: python -m austins_algorithm --shots 64 --seed 7

  optional-framework-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [qiskit, cirq, qasm, ibm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional framework
        run: python -m pip install ".[${{ matrix.extra }}]"
      - name: Run suite with selected framework
        run: python -B -m unittest discover -s tests -v
